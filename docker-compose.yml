# Local stack: the API, the local LLM and the sandbox image.
#
#   docker compose up -d api ollama
#   docker compose --profile sandbox build sandbox
#
# Note: the API container cannot start the sandbox on its own, because the
# sandbox is a `docker run` inside the API process. To evaluate code from the
# containerised API, mount the Docker socket into the api service:
#
#   volumes:
#     - /var/run/docker.sock:/var/run/docker.sock

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      SQLITE_PATH: /srv/data/tutor.db
      CHROMA_DIR: /srv/data/chroma
      SANDBOX_DIR: /srv/data/sandbox
    volumes:
      - api-data:/srv/data
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: sandbox-evaluador
    profiles:
      - sandbox

volumes:
  api-data:
  ollama-models:
